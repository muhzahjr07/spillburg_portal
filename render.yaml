services:
  - type: web
    name: spillburg-portal
    env: python
    plan: free
    region: singapore
    buildCommand: ""
    startCommand: python server.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PORTAL_DATA_DIR
        value: ./data
    # -------------------------------------------------------------------------
    # ZERO-REVERT CLOUD PERSISTENCE (OPTIONAL UPGRADE):
    # Free tier uses ephemeral disk. When upgrading to Render Starter ($7/mo),
    # uncomment the disk block below to mount a permanent cloud volume:
    # -------------------------------------------------------------------------
    # disk:
    #   name: portal-data
    #   mountPath: /var/data
    #   sizeGB: 1
